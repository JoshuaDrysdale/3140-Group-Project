<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">
<!-- LEFT SIDE -->
  <div class="left">
    <div class="logo">🎓 SchoolMart</div>

    <h1>Everything you need<br>for academic success</h1>

    <p class="desc">
      From textbooks to tech, notebooks to backpacks.
      Your one-stop shop for all school essentials.
    </p>

    <div class="features">
      <div class="feature">🚚 Free Shipping</div>
      <div class="feature">🔒 Secure Checkout</div>
      <div class="feature">↩️ Easy Returns</div>
      <div class="feature">🎧 24/7 Support</div>
    </div>
  </div>
  
  <!-- RIGHT SIDE -->
  <div class="right">
    <div class="card">

      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue</p>

      <!-- TABS -->
      <div class="tabs">
        <div class="tab active" id="login-tab">Sign In</div>
        <div class="tab" id="signup-tab">Create Account</div>
      </div>

      <!-- LOGIN -->
       <form id="login-form">
        <input type="text" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button type="submit" class="main-btn">Sign In</button>
       </form>


      <!-- SIGNUP -->
      <form id="signup-form" class="hidden">
        <input type="text" id="signup-name" placeholder="Full Name">
        <input type="text" id="signup-email" placeholder="Email">
        <input type="password" id="signup-password" placeholder="Password">
        <button type="submit" class="main-btn">Create Account</button>
      </form>
 

      <p class="divider">OR CONTINUE WITH</p>

      <div class="socials">
        <button class="social-btn">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
          Google
        </button>

      </div>

    </div>
  </div>

  <script src="loginpage.js"></script>

</body>
</html>
